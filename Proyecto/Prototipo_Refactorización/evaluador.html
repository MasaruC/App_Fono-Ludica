<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <title>Bosque Sonoro • Consola Remota del Evaluador (Micro-SCED)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #0F172A;
      --bg-surface: #1E293B;
      --bg-card: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #475569;
      --border-light: #E2E8F0;
      --primary-blue: #1E3A8A;
      --accent-blue: #2563EB;
      --forest-green: #166534;
      --emerald: #10B981;
      --amber: #F59E0B;
      --purple: #7C3AED;
      --danger: #EF4444;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-full: 9999px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background: #F1F5F9;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    [hidden] {
      display: none !important;
    }

    /* Header Superior Oscuro de Telemetría Remota */
    .remote-header {
      background: var(--bg-app);
      color: #FFFFFF;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.25);
    }

    .remote-header-top {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2E7D32, #10B981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: #94A3B8;
      display: block;
    }

    .room-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .room-input-group {
      display: inline-flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid #334155;
      border-radius: var(--radius-full);
      padding: 3px 6px 3px 12px;
      gap: 6px;
    }

    .room-input-group label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94A3B8;
      text-transform: uppercase;
    }

    .room-input {
      background: transparent;
      border: none;
      color: #F8FAFC;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      font-weight: 800;
      width: 78px;
      text-transform: uppercase;
    }

    .room-input:focus {
      outline: none;
    }

    .btn-sync-now {
      background: var(--accent-blue);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-full);
      padding: 5px 11px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: var(--radius-full);
      background: rgba(16, 185, 129, 0.18);
      color: #6EE7B7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .conn-pill.waiting {
      background: rgba(245, 158, 11, 0.18);
      color: #FCD34D;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    /* Barra de Estado de Sesión en Vivo */
    .session-status-strip {
      max-width: 1040px;
      margin: 10px auto 0;
      padding-top: 9px;
      border-top: 1px solid #1E293B;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: #CBD5E1;
    }

    .status-tag-active {
      color: #FDE68A;
      font-weight: 700;
    }

    /* Pestañas de Navegación del Evaluador */
    .remote-tabs-bar {
      background: #FFFFFF;
      border-bottom: 1.5px solid var(--border-light);
      position: sticky;
      top: 86px;
      z-index: 90;
    }

    .remote-tabs-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      overflow-x: auto;
      gap: 4px;
      padding: 8px 12px;
    }

    .rtab-btn {
      flex: 1 0 auto;
      font-family: var(--font-sans);
      font-size: 0.81rem;
      font-weight: 700;
      color: var(--text-muted);
      background: #F8FAFC;
      border: 1.5px solid var(--border-light);
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 140ms ease;
    }

    .rtab-btn.active {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
      box-shadow: 0 3px 10px rgba(30, 58, 138, 0.22);
    }

    /* Contenedor Principal */
    .remote-main {
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rcard {
      background: var(--bg-card);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }

    .rcard-highlight {
      border: 2px solid #3B82F6;
      background: linear-gradient(180deg, #EFF6FF 0%, #FFFFFF 48%);
    }

    .rcard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .rcard-eyebrow {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-blue);
      background: #DBEAFE;
      padding: 3px 9px;
      border-radius: var(--radius-full);
    }

    .rcard-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* Panel de Calificación Perceptual PSF con el Pulgar */
    .phonation-live-banner {
      background: #0F172A;
      color: #FFFFFF;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .phonation-word-big {
      font-size: 1.4rem;
      font-weight: 800;
      color: #FDE68A;
    }

    .phonation-meta-sub {
      font-size: 0.8rem;
      color: #CBD5E1;
      margin-top: 2px;
    }

    .asr-verdict-pill {
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .asr-verdict-pill.ok {
      background: rgba(16, 185, 129, 0.22);
      color: #6EE7B7;
      border: 1px solid #10B981;
    }

    .asr-verdict-pill.retry {
      background: rgba(168, 85, 247, 0.25);
      color: #E9D5FF;
      border: 1px solid #C084FC;
    }

    .psf-thumb-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .psf-giant-btn {
      min-height: 62px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid var(--border-light);
      background: #F8FAFC;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
      transition: all 140ms ease;
    }

    .psf-giant-btn small {
      font-size: 0.73rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .psf-giant-btn.btn-ok {
      background: #ECFDF5;
      border-color: #6EE7B7;
      color: #065F46;
    }

    .psf-giant-btn.btn-o {
      background: #FFFBEB;
      border-color: #FCD34D;
      color: #92400E;
    }

    .psf-giant-btn.btn-s {
      background: #EFF6FF;
      border-color: #93C5FD;
      color: #1E3A8A;
    }

    .psf-giant-btn.btn-d {
      background: #F5F3FF;
      border-color: #C4B5FD;
      color: #5B21B6;
    }

    .psf-giant-btn.selected {
      transform: scale(1.02);
      box-shadow: 0 0 0 3px var(--text-main);
    }

    .psf-giant-btn:active {
      transform: scale(0.97);
    }

    /* Botones de Control Remoto sobre la Tablet del Niño */
    .remote-actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .raction-btn {
      min-height: 52px;
      padding: 11px 15px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      font-family: var(--font-sans);
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 140ms ease;
    }

    .raction-btn:active {
      transform: scale(0.97);
    }

    .raction-amber {
      background: #FEF3C7;
      color: #92400E;
      border-color: #F59E0B;
    }

    .raction-emerald {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.28);
    }

    .raction-blue {
      background: var(--primary-blue);
      color: #FFFFFF;
    }

    .raction-outline {
      background: #F8FAFC;
      color: #1E293B;
      border-color: #CBD5E1;
    }

    /* KPIs en Vivo */
    .live-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .mini-kpi-box {
      background: #F8FAFC;
      border: 1.5px solid var(--border-light);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mini-kpi-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .mini-kpi-val {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary-blue);
    }

    .mini-kpi-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Tablas y Controles de Escalas */
    .rtable-wrap {
      overflow-x: auto;
    }

    .rtable {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .rtable th, .rtable td {
      padding: 9px 11px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
    }

    .rtable th {
      background: #F8FAFC;
      font-size: 0.74rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .rselect, .rinput {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1.5px solid #CBD5E1;
      background: #FFFFFF;
      color: var(--text-main);
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-size: 0.73rem;
      font-weight: 700;
    }

    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }
    .badge-purple { background: #EDE9FE; color: #5B21B6; }

    .likert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: #F8FAFC;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .likert-btns {
      display: flex;
      gap: 4px;
    }

    .lbtn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1.5px solid #CBD5E1;
      background: #FFFFFF;
      font-weight: 700;
      cursor: pointer;
    }

    .lbtn.active {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
    }

    .event-feed {
      max-height: 170px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      background: #0F172A;
      color: #E2E8F0;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .toast-banner {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: #065F46;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      z-index: 999;
    }

    @media (max-width: 640px) {
      .psf-thumb-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="remote-header">
    <div class="remote-header-top">
      <div class="brand-block">
        <div class="brand-icon" aria-hidden="true">🐝</div>
        <div>
          <h1 class="brand-title">Consola Remota del Evaluador • Micro-SCED</h1>
          <span class="brand-sub">Actividad 10 (Equipo G7 - UNMSM) • Cero Intervención en Pantalla del Niño</span>
        </div>
      </div>

      <div class="room-controls">
        <div class="room-input-group">
          <label for="inpRemoteRoom">Sala:</label>
          <input type="text" id="inpRemoteRoom" class="room-input" value="G7-P01" aria-label="Código de sala" />
          <button type="button" id="btnConnectRoom" class="btn-sync-now">Conectar</button>
        </div>
        <span id="connStatusPill" class="conn-pill waiting">
          <span class="live-dot"></span>
          <span id="connStatusText">Sincronizando...</span>
        </span>
      </div>
    </div>

    <div class="session-status-strip" id="remoteSessionStrip">
      <span><strong>Participante:</strong> <span id="lblParticipant">P01 (Mateo, 4 años)</span></span>
      <span><strong>Tarea en Tablet del Niño:</strong> <span id="lblCurrentTask" class="status-tag-active">Esperando inicio...</span></span>
      <span><strong>Emojis Niño:</strong> <span id="lblEmojiProgress">Pendiente</span></span>
    </div>
  </header>

  <nav class="remote-tabs-bar" role="tablist">
    <div class="remote-tabs-inner">
      <button type="button" class="rtab-btn active" data-rtab="live">🎛️ 1. Mando en Vivo &amp; PSF</button>
      <button type="button" class="rtab-btn" data-rtab="bosch">🗣️ 2. Ficha Bosch &amp; Melgar (<span id="tabCountPhono">0</span>)</button>
      <button type="button" class="rtab-btn" data-rtab="pssuq">👩‍🏫 3. Mediador: PSSUQ &amp; MARS</button>
      <button type="button" class="rtab-btn" data-rtab="nielsen">📊 4. Nielsen, 12 KPIs &amp; Exportar</button>
    </div>
  </nav>

  <main class="remote-main" id="remoteMainContainer">
    <!-- Renderizado dinámico por js/remote-evaluator-app.js -->
  </main>

  <div id="remoteToast" class="toast-banner" hidden>✓ Acción enviada a la tablet del niño</div>

  <script src="js/telemetry-eval-engine.js"></script>
  <script src="js/remote-evaluator-app.js"></script>
</body>
</html>
